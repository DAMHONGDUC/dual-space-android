plugins {
    id 'com.android.library'
}

android {
    namespace 'com.dd.the.universe'

    compileSdk 37


    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdk 29

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion "28.2.13676358"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable += ["UnusedResources", "RestrictedApi"]
        checkOnly += ["NewApi", "InlinedApi"]
    }
}


tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation(project(":the-universe-reflection"))
    annotationProcessor(project(":the-universe-compiler"))

    // Engine chỉ cần annotation (@Keep/@NonNull/@RequiresApi). Trước đây các lớp
    // androidx đến gián tiếp qua appcompat — một thư viện UI engine không dùng;
    // các shim còn lại đã được thay bằng API nền tảng vì minSdk là 29.
    implementation 'androidx.annotation:annotation:1.8.0'

    implementation 'com.github.tiann:FreeReflection:3.2.2'



    
}
